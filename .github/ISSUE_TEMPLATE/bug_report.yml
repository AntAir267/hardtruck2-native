name: Bug report
description: Something in the game or the setup doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't attach any of the game's files or screenshots of copied game data; logs and your own screenshots are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Linux distribution or Windows version, graphics card and driver, controller if any.
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer (MORE OPTIONS)
      options: [Original, Native, Don't know]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: last-run.log (or setup.log if setting up failed) from ~/.local/share/hardtruck2-native or %APPDATA%\hardtruck2-native.
      render: text
